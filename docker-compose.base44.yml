services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5173/ >/dev/null || (echo 'vite not responding' && exit 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  node_modules:
